<!-- ===========================================================
     CSS: canvas fills the entire viewport, no scrolling
     =========================================================== -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  /* 100dvh = dynamic viewport height; on mobile Safari/Chrome this
     excludes the bottom UI bar automatically. Older browsers fall
     back to 100vh and the canvas may sit behind the bar. */
  #CSCanvas  { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
  *          { margin: 0; padding: 0; }
  #CSConsole {
    background-color: #FAFAFA; border-top: 1px solid #333;
    bottom: 0; height: 200px; overflow-y: scroll;
    position: fixed; width: 100%;
  }

  /* ── Ergebnis-Eingabe ("clever messen") ──────────────────────────
     Kleines HTML-Panel unten rechts, als Overlay über dem Canvas
     (ComplexGrid-Muster). Es sitzt oberhalb des 60px-Credits-Footers.
     pointer-events liegen NUR auf dem Eingabefeld — der Rest des
     Panels lässt Klicks zum Canvas durch (Geodreieck ziehen). */
  #resultPanel{
    position:fixed; right:14px; bottom:96px; z-index:5;   /* clears the ≤76px credits footer */
    pointer-events:none; display:none;
    box-sizing:border-box; width:232px;                   /* fixed → no resize on input */
    font-family:sans-serif; color:#33383a;
    background:rgb(236,240,242); border:1px solid #d0dadd; border-radius:12px;
    padding:8px 12px; box-shadow:0 2px 8px rgba(20,40,45,.10);
  }
  #resultPanel .rp-row{ display:flex; align-items:center; gap:8px; }
  #resultPanel .rp-lbl{ color:#327a86; font-weight:600; font-size:17px; }
  #resultPanel #rp-in{
    pointer-events:auto;
    width:72px; font-size:16px; text-align:right;   /* ≥16px: kein iOS-Zoom */
    padding:3px 6px; border:1px solid #b9c6c9; border-radius:6px;
    background:#fff; color:#33383a;
  }
  #resultPanel .rp-status{
    margin-top:6px; min-height:18px; white-space:nowrap;
    display:flex; gap:14px; font-size:13px; font-weight:600;
  }
  #resultPanel .rp-good   { color:#2e8b57; }   /* grün  – passt        */
  #resultPanel .rp-mid    { color:#c8851f; }   /* orange – ungefähr    */
  #resultPanel .rp-bad    { color:#a44168; }   /* weinrot – daneben    */
  #resultPanel .rp-neutral{ color:#8a9499; font-weight:500; }
</style>

<link rel="stylesheet" href="https://cindyjs.org/dist/v0.8/CindyJS.css">

<!-- ===========================================================
     CSINIT — one-time initialization
     =========================================================== -->
<script id="csinit" type="text/x-cindyscript">

// ════════════════════════════════════════════════════════════════
// APPLET CONFIG — edit per applet
// ════════════════════════════════════════════════════════════════
appletTitle        = "Das Skalarprodukt „clever messen“";
appletAuthors      = "Max Hoffmann, Janine Herrmann, Olga Lomas & Lena Wessel";
appletAffiliations = "QuaMath (DZLM + IPN, gef. v. KMK) | LiAnMU | Universität Paderborn";
appletContact      = "max.hoffmann@math.uni-paderborn.de";
appletVersion      = "v2026-05-19";
appletLicense      = "MIT License";


// ════════════════════════════════════════════════════════════════
// PLATFORM SECTION — shared framework, identical across applets
// Do not edit unless you are updating the framework.
// ════════════════════════════════════════════════════════════════

// ----------------------------------------------------------------
// Color palette (RGB, normalized to 0.0–1.0)
// Primary: Petrol | Secondary: Orange, Gray | Tertiary: Wine Red
// Context: Ochre
// ----------------------------------------------------------------
white = [1, 1, 1];

petrol100 = [50, 122, 134] / 255;
petrol75  = [114, 143, 153] / 255;
petrol50  = [152, 171, 178] / 255;
petrol25  = [192, 202, 206] / 255;
petrol10  = [212, 219, 222] / 255;
petrol5   = [236, 240, 242] / 255;   // very light tint (e.g. Rechnung box)
petrol    = petrol100;

orange100 = [248, 180, 79]  / 255;
orange75  = [242, 184, 107] / 255;
orange50  = [246, 201, 141] / 255;
orange25  = [249, 221, 182] / 255;
orange10  = [253, 245, 233] / 255;
orange    = orange100;

wineRed100 = [164, 65, 104]  / 255;
wineRed75  = [162, 93, 117]  / 255;
wineRed50  = [182, 128, 146] / 255;
wineRed25  = [202, 162, 174] / 255;
wineRed10  = [227, 206, 213] / 255;
wineRed    = wineRed100;

gray100 = [115, 115, 115] / 255;
gray75  = [135, 136, 136] / 255;
gray50  = [164, 166, 166] / 255;
gray25  = [227, 228, 228] / 255;
gray10  = [239, 239, 239] / 255;
gray    = gray100;

ochre100 = [205, 185, 135] / 255;
ochre75  = [201, 188, 157] / 255;
ochre50  = [214, 204, 179] / 255;
ochre25  = [227, 221, 203] / 255;
ochre10  = [241, 238, 227] / 255;
ochre    = ochre100;

// ----------------------------------------------------------------
// Concept colors — semantic palette for mathematical objects.
// Per-applet overrides allowed in the APPLET LOGIC section.
// ----------------------------------------------------------------
colorVector = petrol100;   // arrows, vector labels, components
colorPoint  = wineRed100;  // free / movable points
colorScalar = gray100;     // numeric scalars, lengths, dot products
colorAngle  = orange100;   // angle arcs and labels
colorLine   = gray75;      // lines, rays, segments
colorAccent = wineRed100;  // highlights, edit-mode chrome
colorChrome = gray100;      // titles, credits, neutral UI text

// ----------------------------------------------------------------
// Coordinate grid. The framework draws the grid itself (drawGrid),
// so its colour is fully configurable here. The port's `grid` value
// still drives drag-snapping and should match gridSpacing.
//   gridColor : line colour, 0 = black … 1 = white.
//               higher = fainter, lower = stronger.
// ----------------------------------------------------------------
gridColor   = [0.80, 0.81, 0.81];   // ≈ 20% gray, a touch stronger than CindyJS' faint default
gridSpacing = 0.5;                  // world units between grid lines (match the port `grid`)
gridWidth   = 1;                    // line width in px

// ----------------------------------------------------------------
// Typography (point sizes). Each role: landscape / portrait.
// Mobile sizes are ≥ landscape: a phone is held closer, but physical
// readability still requires equal or larger glyphs, never smaller.
// Applets may override locally if the visual hierarchy demands it
// (see fsSkp / fsComps in this applet's csdraw).
// ----------------------------------------------------------------
fontTitle     = 24;   fontTitleP     = 26;
fontStatus    = 18;   fontStatusP    = 18;
fontCredits   = 13;   fontCreditsP   = 12;
fontMathBig   = 28;   fontMathBigP   = 32;   // main displayed quantity
fontMathMed   = 22;   fontMathMedP   = 26;   // secondary labels
fontMathSmall = 16;   fontMathSmallP = 18;   // helper labels

// ----------------------------------------------------------------
// Layout pixel budget. All anchors derive from these constants.
// Suffix P denotes portrait variant.
// ----------------------------------------------------------------
layoutOuterPad     = 16;   layoutOuterPadP     = 10;
layoutHeaderHpx    = 56;   layoutHeaderHpxP    = 48;
layoutFooterHpx    = 60;   layoutFooterHpxP    = 56;   // status OR credits
layoutUnitHpx      = 26;   layoutUnitHpxP      = 24;   // unit-segment row
layoutGapPx        = 8;    layoutGapPxP        = 6;
layoutBrowserBarPx = 0;    layoutBrowserBarPxP = 0;    // handled by 100dvh CSS
layoutSidebarWpx   = 90;                               // landscape: default width
layoutSidebarHpx   = 64;                               // portrait:  default height
layoutSidebarMinWpx = 60;  layoutSidebarMinHpx = 50;   // framework minima
layoutSidebarMaxWpx = 240; layoutSidebarMaxHpx = 200;  // framework maxima
layoutSidebarMaxFrac = 0.35;                           // never larger than this
                                                       // fraction of the outer rect
layoutCogBtnPx     = 40;   layoutCogBtnPxP     = 36;

// ----------------------------------------------------------------
// Per-frame UI state
// ----------------------------------------------------------------
// The sidebar follows the cog (= editmode) by default. To override,
// set sidebarFollowsEditmode = false and manage sidebarVisible
// manually in csdraw before calling platformBeginFrame().
sidebarFollowsEditmode = true;
sidebarVisible         = false;

// Sidebar content size request (in pixels). The framework clamps to
// [layoutSidebarMin…, layoutSidebarMax…] and to layoutSidebarMaxFrac
// of the outer rect. Set per applet in csinit, or per frame in csdraw
// before platformBeginFrame() to make the sidebar grow with content.
sidebarWantedWpx = layoutSidebarWpx;
sidebarWantedHpx = layoutSidebarHpx;

// Status state — empty statusLines means: show credits in the footer row.
statusLines  = [];
statusFg     = wineRed100;
statusBorder = wineRed100;
statusFill   = wineRed10;

// ----------------------------------------------------------------
// Status API
// Built-in modes: "hint" (petrol), "alert" (wineRed),
//                 "info" (gray), "success" (ochre).
// Use setStatusCustom() to pick colors directly.
// `lines` must be a list of strings (one entry per visual line).
// ----------------------------------------------------------------
setStatus(lines, mode) := (
  statusLines = lines;
  if(mode == "hint",
    statusFg     = petrol100;
    statusBorder = petrol100;
    statusFill   = petrol10;
  );
  if(mode == "alert",
    statusFg     = wineRed100;
    statusBorder = wineRed100;
    statusFill   = wineRed10;
  );
  if(mode == "info",
    statusFg     = gray100;
    statusBorder = gray75;
    statusFill   = gray10;
  );
  if(mode == "success",
    statusFg     = ochre100;
    statusBorder = ochre100;
    statusFill   = ochre10;
  );
);

setStatusCustom(lines, fg, border, fill) := (
  statusLines  = lines;
  statusFg     = fg;
  statusBorder = border;
  statusFill   = fill;
);

clearStatus() := ( statusLines = []; );

// ----------------------------------------------------------------
// Anchor computation. Call once at the top of csdraw, then read
// the ax* globals from every drawing function.
//
// Layout (top to bottom):
//   ┌───────────────────────────────────┐
//   │ TITLE                       ⚙     │  header
//   ├───────────────────────────────────┤
//   │           CONTENT                 │  content
//   │                  ┌────────┐       │
//   │                  │sidebar │       │  sidebar (dynamic)
//   │ unit ─                            │  unit row
//   │ STATUS  *or*  credits             │  footer
//   └───────────────────────────────────┘
// ----------------------------------------------------------------
computeAnchors() := (
  regional(b, sr, oPad, hH, fH, uH, gap, bbPx, sbW, sbH, cogPx, cogHalf);

  b      = screenbounds();
  xmin   = b_1_1;  xmax = b_2_1;
  ymin   = b_3_2;  ymax = b_1_2;
  width  = xmax - xmin;
  height = ymax - ymin;
  sr     = screenresolution();
  isPortrait = height > width;
  // Global text-scale factor so every label shrinks/grows with the
  // canvas — keeps small embeds (Moodle iframes) from looking overwhelmed
  // while staying readable on phones. Based on the geometric mean of the
  // canvas pixel size, gently clamped so it never gets tiny or huge.
  fontScale = max(0.6, min(1.0, sqrt(width * height) * sr / 850));

  oPad = if(isPortrait, layoutOuterPadP,     layoutOuterPad)     / sr;
  hH   = if(isPortrait, layoutHeaderHpxP,    layoutHeaderHpx)    / sr;
  fH   = if(isPortrait, layoutFooterHpxP,    layoutFooterHpx)    / sr;
  uH   = if(isPortrait, layoutUnitHpxP,      layoutUnitHpx)      / sr;
  gap  = if(isPortrait, layoutGapPxP,        layoutGapPx)        / sr;
  bbPx = if(isPortrait, layoutBrowserBarPxP, layoutBrowserBarPx) / sr;
  // Clamp the requested sidebar size to framework min/max and to
  // a fraction of the outer rectangle. Done before axLeft etc. are
  // used by the sidebar branches below.
  sbW = max(layoutSidebarMinWpx,
            min(sidebarWantedWpx,
                min(layoutSidebarMaxWpx,
                    layoutSidebarMaxFrac * (xmax - xmin) * sr))) / sr;
  sbH = max(layoutSidebarMinHpx,
            min(sidebarWantedHpx,
                min(layoutSidebarMaxHpx,
                    layoutSidebarMaxFrac * (ymax - ymin) * sr))) / sr;

  // Outer rectangle (inside outer padding)
  axLeft   = xmin + oPad;
  axRight  = xmax - oPad;
  axTop    = ymax - oPad;
  axBottom = ymin + bbPx + oPad;

  // Header (title left, cog right)
  axHeaderTop    = axTop;
  axHeaderBottom = axTop - hH;
  axHeaderCy     = 0.5 * (axHeaderTop + axHeaderBottom);
  axTitleLeft    = axLeft;
  axTitleCy      = axHeaderCy;

  // Cog button (square hitbox, right-aligned in header)
  cogPx   = if(isPortrait, layoutCogBtnPxP, layoutCogBtnPx);
  cogHalf = cogPx / 2 / sr;
  axCogCx    = axRight - cogHalf;
  axCogCy    = axHeaderCy;
  axCogLeft  = axCogCx - cogHalf;
  axCogRight = axCogCx + cogHalf;
  axCogTop   = axCogCy + cogHalf;
  axCogBot   = axCogCy - cogHalf;

  // Footer (status box OR credits, never both)
  axFooterTop   = axBottom + fH;
  axFooterBot   = axBottom;
  axFooterCy    = 0.5 * (axFooterTop + axFooterBot);
  axFooterLeft  = axLeft;
  axFooterRight = axRight;

  // Unit row (directly above footer)
  axUnitBot  = axFooterTop + gap;
  axUnitTop  = axUnitBot + uH;
  axUnitCy   = 0.5 * (axUnitTop + axUnitBot);
  axUnitLeft = axLeft;

  // Content + sidebar — orientation- and visibility-dependent
  axContentTop  = axHeaderBottom - gap;
  axContentLeft = axLeft;

  if(isPortrait,
    axSidebarLeft  = axLeft;
    axSidebarRight = axRight;
    if(sidebarVisible,
      axSidebarBot    = axUnitTop + gap;
      axSidebarTop    = axSidebarBot + sbH;
      axContentRight  = axRight;
      axContentBottom = axSidebarTop + gap;
    ,
      axSidebarBot    = axUnitTop;
      axSidebarTop    = axUnitTop;   // degenerate (height 0)
      axContentRight  = axRight;
      axContentBottom = axUnitTop + gap;
    );
  ,
    axSidebarTop = axContentTop;
    axSidebarBot = axUnitTop + gap;
    if(sidebarVisible,
      axSidebarRight  = axRight;
      axSidebarLeft   = axRight - sbW;
      axContentRight  = axSidebarLeft - gap;
      axContentBottom = axUnitTop + gap;
    ,
      axSidebarLeft   = axRight;
      axSidebarRight  = axRight;       // degenerate (width 0)
      axContentRight  = axRight;
      axContentBottom = axUnitTop + gap;
    );
  );

  axContentCx = 0.5 * (axContentLeft + axContentRight);
  axContentCy = 0.5 * (axContentTop  + axContentBottom);
);

// ----------------------------------------------------------------
// Sidebar local coordinate system
//
// Inside drawSidebar(), use these helpers to position content with
// (0, 0) at the bottom-left corner of the sidebar, measured in
// pixels. The framework clamps the sidebar size based on
// sidebarWantedWpx / sidebarWantedHpx, so use sbWidthPx() /
// sbHeightPx() to size things relative to the actual sidebar.
// ----------------------------------------------------------------
sb(px, py)  := [axSidebarLeft + px / screenresolution(),
                axSidebarBot  + py / screenresolution()];
sbWidthPx()  := (axSidebarRight - axSidebarLeft) * screenresolution();
sbHeightPx() := (axSidebarTop   - axSidebarBot)  * screenresolution();

// Applet hook. Override in the APPLET LOGIC section.
// Called automatically by csdraw whenever sidebarVisible is true.
drawSidebar() := ( );

// ----------------------------------------------------------------
// Frame entry point. Call as the first line of csdraw.
// Syncs sidebarVisible to editmode (when sidebarFollowsEditmode is
// true) and recomputes all anchors.
// ----------------------------------------------------------------
platformBeginFrame() := (
  if(sidebarFollowsEditmode, sidebarVisible = editmode);
  computeAnchors();
  drawGrid();
);

// ----------------------------------------------------------------
// Coordinate grid, drawn by the framework (opaque, so its colour is
// fully controllable — see gridColor). Spans the whole visible region
// at gridSpacing. CindyJS' built-in grid still renders underneath for
// snapping but is covered by these lines.
// ----------------------------------------------------------------
drawGrid() := (
  regional(x0, x1, y0, y1, nx, ny);
  x0 = floor(xmin / gridSpacing) * gridSpacing;
  x1 = ceil (xmax / gridSpacing) * gridSpacing;
  y0 = floor(ymin / gridSpacing) * gridSpacing;
  y1 = ceil (ymax / gridSpacing) * gridSpacing;
  nx = round((x1 - x0) / gridSpacing);
  ny = round((y1 - y0) / gridSpacing);
  repeat(nx + 1, i,
    draw([x0 + (i - 1) * gridSpacing, y0], [x0 + (i - 1) * gridSpacing, y1],
         color -> gridColor, size -> gridWidth));
  repeat(ny + 1, i,
    draw([x0, y0 + (i - 1) * gridSpacing], [x1, y0 + (i - 1) * gridSpacing],
         color -> gridColor, size -> gridWidth));
);

// ----------------------------------------------------------------
// Label with an exactly-fitting background, measured from the ACTUAL
// rendered text. pixelsize(text, size -> fs) returns
// [width, ascent, descent] in px — measured the same way (and with the
// same anchor) drawtext renders, so it is correct for KaTeX too. The
// background therefore fits and stays centred at any font size, instead
// of relying on hand-tuned multipliers.
//
//   x, y     – anchor point in world coordinates
//   halign   – "left" | "center" | "right"
//   valign   – "top" (y = box top) | "mid" (y = box centre)
//              | "base" (y = text baseline)
//   showBg   – true → white background; false → transparent (no box).
//              Drive this from a per-field flag so an applet can switch
//              any label's background on/off in one place.
//   padPx    – uniform padding around the text, px
//   returns  – the box bottom y (so labels can be stacked)
// ----------------------------------------------------------------
drawLabel(x, y, text, fs, textcol, halign, valign, showBg, padPx) := (
  regional(sr, m, w, asc, desc, ax, ay, l, r, bb, tt);
  sr  = screenresolution();
  m   = pixelsize(text, size -> fs);
  w   = m_1; asc = m_2; desc = m_3;
  ax  = x + if(halign == "center", -w / (2 * sr),
           if(halign == "right",   -w / sr, 0));
  ay  = if(valign == "top", y - (padPx + asc) / sr,
        if(valign == "mid", y + (desc - asc) / (2 * sr),
                            y));
  l   = ax - padPx / sr;
  r   = ax + (w + padPx) / sr;
  bb  = ay - (desc + padPx) / sr;
  tt  = ay + (asc  + padPx) / sr;
  if(showBg, fillpoly([[l, bb], [r, bb], [r, tt], [l, tt]], color -> white));
  drawtext([ax, ay], text, size -> fs, color -> textcol, align -> "left");
  bb
);

// Backward-compatible wrapper: pos-anchored, vertically centred, always
// shows a white background. Kept so plain callers keep working while
// now being measured/adaptive (bgcol is assumed white).
drawTextWithBg(pos, text, fs, col, bgcol, padPx, alignment) :=
  drawLabel(pos.x, pos.y, text, fs, col, alignment, "mid", true, padPx);

// Single-line text in a coloured, bordered box centred horizontally in
// the content area and anchored just above the footer (content bottom),
// with a left-aligned heading above the box. The body font auto-shrinks
// from baseFs so the line always fits the content width (important in
// portrait). Used for the explicit a·b computation.
drawCenteredBox(text, heading, baseFs, headFs, fillCol, borderCol, txtCol, headCol, boxBottomY) := (
  regional(sr, pad, maxWpx, m0, fs, m, cw, ca, cd, H, W, by0, cx, cy, l, r, bb, tt);
  sr     = screenresolution();
  pad    = 12;
  maxWpx = (axContentRight - axContentLeft) * sr - 4 * pad;
  m0     = pixelsize(text, size -> baseFs);
  fs     = if(m0_1 > maxWpx, baseFs * maxWpx / m0_1, baseFs);
  m      = pixelsize(text, size -> fs);
  cw = m_1; ca = m_2; cd = m_3;
  H   = (ca + cd + 2 * pad) / sr;
  W   = (cw + 2 * pad) / sr;
  by0 = boxBottomY;                   // box bottom (world y), set by caller
  cx  = axContentCx;
  cy  = by0 + H / 2;
  l = cx - W / 2; r = cx + W / 2; bb = by0; tt = by0 + H;
  fillpoly([[l, bb], [r, bb], [r, tt], [l, tt]], color -> fillCol);
  draw([l, bb], [r, bb], color -> borderCol, size -> 1.2);
  draw([r, bb], [r, tt], color -> borderCol, size -> 1.2);
  draw([r, tt], [l, tt], color -> borderCol, size -> 1.2);
  draw([l, tt], [l, bb], color -> borderCol, size -> 1.2);
  drawLabel(cx, cy, text, fs, txtCol, "center", "mid", false, pad);
  // Heading above the box, left-aligned with the body text's left edge
  // (= the inner padding edge l + pad).
  drawLabel(l + pad / sr, tt + 7 / sr, heading, headFs, headCol, "left", "base", false, 0);
);

// ----------------------------------------------------------------
// Chrome drawing
// ----------------------------------------------------------------

drawTitle() := (
  regional(fs);
  fs = fontScale * if(isPortrait, fontTitleP, fontTitle);
  drawLabel(axTitleLeft, axTitleCy, appletTitle,
            fs, colorChrome, "left", "mid", labelBgTitle, 6);
);

drawCog() := (
  regional(sz);
  // The cog itself signals the mode: wine red while editing,
  // black otherwise. No background highlight.
  sz = fontScale * if(isPortrait, 55, 65);
  drawtext([axCogCx, axCogCy], "⚙",
    align   -> "center", size -> sz,
    color   -> if(editmode, wineRed, [0, 0, 0]),
    yoffset -> -sz * 0.27);
);

// Unit segment snapped to the 0.5 grid so both endpoints land on
// grid intersections and the segment overlaps a horizontal grid line.
drawUnit() := (
  regional(uX, uY);
  uX = ceil(axUnitLeft / 0.5) * 0.5;
  uY = round(axUnitCy   / 0.5) * 0.5;
  draw([uX, uY], [uX + 1, uY], color -> gray, size -> 5);
  drawtext([uX + 0.5, uY], "1",
    yoffset -> 10, color -> gray, size -> fontScale * 16,
    align   -> "center");
);

drawStatusBox() := (
  regional(sr, fs, padPx, lineHpx, n, totalH, boxL, boxR, boxT, boxB,
           cx, cy, i, ypx);
  sr      = screenresolution();
  fs      = fontScale * if(isPortrait, fontStatusP, fontStatus);
  padPx   = 10;
  lineHpx = fs * 1.2;
  n       = length(statusLines);
  totalH  = (n * lineHpx + 2 * padPx) / sr;

  cx     = 0.5 * (axFooterLeft + axFooterRight);
  cy     = axFooterCy;
  boxL   = axFooterLeft  + padPx / sr;
  boxR   = axFooterRight - padPx / sr;
  boxT   = cy + totalH / 2;
  boxB   = cy - totalH / 2;
  if(boxT > axFooterTop, boxT = axFooterTop);
  if(boxB < axFooterBot, boxB = axFooterBot);

  fillpoly([[boxL, boxB], [boxR, boxB], [boxR, boxT], [boxL, boxT]],
           color -> statusFill);
  drawpoly([[boxL, boxB], [boxR, boxB], [boxR, boxT], [boxL, boxT]],
           color -> statusBorder, size -> 1.5);

  // All lines anchored at the box center cy; symmetric yoffsets
  // stack them. The -0.27*fs term shifts the baseline down so the
  // visual glyph centers (not the baselines) land on the line grid.
  forall(1..n, i,
    ypx = (n + 1 - 2 * i) * lineHpx / 2 - 0.27 * fs;
    drawtext([cx, cy], statusLines_i,
      align -> "center", size -> fs, color -> statusFg, yoffset -> ypx);
  );
);

drawCredits() := (
  regional(sr, fs, dy, edge);
  sr   = screenresolution();
  fs   = fontScale * if(isPortrait, fontCreditsP, fontCredits);
  dy   = (fs + 4) / sr;
  edge = axFooterRight;
  drawtext([edge, axFooterCy + dy], appletAuthors,
    size -> fs, color -> colorChrome, align -> "right");
  drawtext([edge, axFooterCy], appletAffiliations,
    size -> fs, color -> colorChrome, align -> "right");
  drawtext([edge, axFooterCy - dy],
    appletContact + "  |  " + appletVersion + "  |  " + appletLicense,
    size -> fs, color -> colorChrome, align -> "right");
);

drawStatusOrCredits() := (
  if(length(statusLines) > 0,
    drawStatusBox();
  ,
    drawCredits();
  );
);

// ----------------------------------------------------------------
// Math primitives
// ----------------------------------------------------------------

// Perpendicular unit vector (90° rotation, normalized)
perpVec(v) := [-v.y, v.x] / |v|;

// Vector arrows -------------------------------------------------
// vecSettings = [labelOffsetPx, shaftThickness, arrowheadWidthFactor, arrowheadHeightFactor]
//   _1: label distance from shaft (px; positive = left, negative = right)
//   _2: half shaft width (in coord units)
//   _3: arrowhead width multiplier (relative to 2 * shaft width)
//   _4: arrowhead height multiplier (relative to 2 * shaft width)
vecLabelSize = 20;
vecSettingsL = [ 20, 0.05, 4, 4.0];
vecSettingsR = [-30, 0.05, 4, 4.0];

veclabel(start, end, name, settings, col) := (
  regional(v, p, lab, pos, sep, thick);
  sep   = settings_1;
  thick = settings_2;
  lab   = "$\vec{" + name + "}$";
  v     = end - start;
  p     = perpVec(v);
  pos   = 0.5 * (start + end) + (sep / screenresolution() + thick) * p;
  drawtext(pos, lab, color -> col, size -> fontScale * vecLabelSize);
);

drawArrow(A, B, name, settings, col) := (
  regional(v, u, p, sT, hWF, hHF, hHalfW, hH, base, hPoly, sPoly);
  sT  = settings_2;
  hWF = settings_3;
  hHF = settings_4;
  v   = B - A;
  if(|v| > 10^(-5),
    u      = v / |v|;
    p      = perpVec(v);
    hHalfW = sT * hWF;
    hH     = 2 * sT * hHF;
    base   = B - hH * u;
    hPoly  = polygon((B, base + p * hHalfW, base - p * hHalfW));
    sPoly  = polygon((A + p * sT, A - p * sT, base - p * sT, base + p * sT));
    fill(hPoly, color -> col);
    fill(sPoly, color -> col);
    veclabel(A, B, name, settings, col);
  );
);

// Angles --------------------------------------------------------
// drawAngle(P1, P2, C, r, col, alpha, label, labelPos, labelCol)
//   P1, P2   – two points defining the legs (rays C→P1 and C→P2)
//   C        – vertex
//   r        – arc radius (coord units)
//   col      – stroke color
//   alpha    – fill blend toward white (0 = no fill, 1 = white)
//   label    – LaTeX string without $…$, or "VAL" for the numeric value
//   labelPos – label distance factor along the bisector (1.0 = on arc)
//   labelCol – label color
//
// Convenience wrapper drawAngleC() uses the concept defaults
// (colorAngle, alpha 0.9, labelPos 0.7) — see APPLET LOGIC.
angLabelSize = 20;
angArcSize   = 2;

drawAngle(P1, P2, C, r, col, alpha, label, labelPos, labelCol) := (
  regional(a1, a2, sweep, arcRes, arcPoints, labelPt, labelDir);
  a1    = arctan2(P1 - C);
  sweep = arccos((P1 - C) * (P2 - C) / (|P1 - C| * |P2 - C|));
  a2    = a1 + sweep;
  if(sweep > 1° & r > 0.01,
    arcRes    = max(5, round(sweep * 30));
    arcPoints = [C];
    repeat(arcRes, start -> a1, stop -> a2, a,
      arcPoints = arcPoints ++ [gauss(exp(i * a) * r * 25 / screenresolution()) + C]
    );
    arcPoints = arcPoints ++ [C.xy];
    if(alpha > 0,
      fillpoly(arcPoints, color -> col * (1 - alpha) + (1, 1, 1) * alpha)
    );
    connect(arcPoints, size -> angArcSize, border -> false, color -> col);
    labelDir = gauss(exp(i * (a1 + a2) / 2));
    labelPt  = C + labelDir * (labelPos * r * 25 / screenresolution()) + (0, -0.1);
    if(label == "VAL",
      drawtext(labelPt, (a2 - a1), align -> "center", tex -> true, color -> labelCol),
      drawtext(labelPt, "$" + label + "$",
        align -> "center", tex -> true, color -> labelCol, size -> fontScale * angLabelSize)
    );
  );
);

// drawAngleC(P1, P2, C, r, label)
// Convenience wrapper using concept defaults.
drawAngleC(P1, P2, C, r, label) :=
  drawAngle(P1, P2, C, r, colorAngle, 0.9, label, 0.7, colorAngle);

// Vector LaTeX printer ------------------------------------------
// texVec(name, vec)            → digits = 2
// texVec(name, vec, digits)    → custom precision
// Renders $\vec{name} = \begin{pmatrix} … \end{pmatrix}$ when the
// rounded values are exact, otherwise \approx.
// Works for any dimension n.
texVec(name, v) := texVec(name, v, 2);
texVec(name, v, digits) := (
  regional(scale, n, rounded, exact, body, rel, tol);
  scale   = 10^digits;
  n       = length(v);
  tol     = 5 * 10^(-digits - 2);
  rounded = apply(1..n, k, round(scale * v_k) / scale);
  exact   = forall(1..n, k, |rounded_k - v_k| < tol);
  rel     = if(exact, "=", "\approx");
  body    = "";
  forall(1..n, k,
    body = body + rounded_k;
    if(k < n, body = body + " \\ ");
  );
  // \! pulls the pmatrix slightly closer to the relation symbol so
  // the gap matches "ä ≈ (…)" rather than the wider default LaTeX
  // spacing around \approx.
  "$\vec{" + name + "} " + rel + "\!\, \begin{pmatrix} " + body + " \end{pmatrix}$"
);

// Number → TeX string, negatives wrapped in parentheses so a product
// term reads "4 \cdot (-2.87)" instead of "4 \cdot -2.87".
fmtNeg(x) := if(x < 0, "(" + x + ")", "" + x);

// Point pulse animation -----------------------------------------
// pulsePoint(P)                       — defaults: base = 5, amp = 3.2, freq = 4
// pulsePoint(P, base, amp, freq)      — explicit
// Call from csmove. Sets P.size to a sin² oscillation.
pulsePoint(P) := pulsePoint(P, 5, 3.2, 4);
pulsePoint(P, base, amp, freq) := (
  P.size = base + amp * sin(freq * seconds())^2;
);


// ════════════════════════════════════════════════════════════════
// APPLET LOGIC — applet-specific drawing and state
// ════════════════════════════════════════════════════════════════

sidebarWantedWpx = 160;   // wider than default (90) to fit button labels
sidebarWantedHpx = 170;   // fits three stacked edit-mode buttons

// ---- Text-field backgrounds ------------------------------------
// Flip any of these to false to make that label transparent (no white
// box behind it). They feed the showBg argument of drawLabel().
labelBgTitle = true;    // applet title (top-left)
labelBgComps = true;    // a / b component labels (top-left)
labelBgSkp   = true;    // scalar-product result next to B

// ---- Geometry helpers ------------------------------------------
crossz(u, v) := u.x * v.y - u.y * v.x;

distToSeg(P, S, E) := (
  regional(d, t);
  d = E - S;
  if(|d| < 0.0001, |P - S|,
    t = max(0, min(1, ((P - S) * d) / (d * d)));
    |P - (S + t * d)|
  );
);

pointInTri(P, Aa, Bb, Cc) := (
  regional(d1, d2, d3, neg, pos);
  d1 = crossz(P - Aa, Bb - Aa);
  d2 = crossz(P - Bb, Cc - Bb);
  d3 = crossz(P - Cc, Aa - Cc);
  neg = (d1 < 0) % (d2 < 0) % (d3 < 0);
  pos = (d1 > 0) % (d2 > 0) % (d3 > 0);
  !(neg & pos);
);

// projection of P onto the line through Pt with unit direction dir
projOntoLine(P, Pt, dir) := Pt + ((P - Pt) * dir) * dir;

// ---- Two free vectors a = OA, b = OB ---------------------------
drawVecs() := (
  drawArrow(O, B, "b", vecSettingsL, colorVector);
  drawArrow(O, A, "a", vecSettingsR, colorVector);
);

// ════════════════════════════════════════════════════════════════
// GEODREIECK (set square): movable + rotatable measuring/drawing tool
// Local frame: long edge from (-gHalf,0)..(gHalf,0); right-angle peak
// at (0,gPeak). gP = world position of the long-edge midpoint (scale 0);
// gAng = rotation of the long edge. Scale spans the applet's units.
// ════════════════════════════════════════════════════════════════
geoPt(lx, ly) := gP + [lx * cos(gAng) - ly * sin(gAng),
                       lx * sin(gAng) + ly * cos(gAng)];

// Circular double-arrow icon (rotation affordance) centred at c.
arcPts(c, R, t1, t2, n) := apply(0..n, j,
  c + R * [cos(t1 + (t2 - t1) * j / n), sin(t1 + (t2 - t1) * j / n)]);

drawRotArrow(c, R, t1, t2, col) := (
  regional(tip, tdir, rad, base);
  connect(arcPts(c, R, t1, t2, 16), color -> col, size -> 3, border -> false);
  tip  = c + R * [cos(t2), sin(t2)];
  tdir = [-sin(t2), cos(t2)];        // CCW tangent at the arc end
  rad  = [cos(t2), sin(t2)];         // radial
  base = tip - 0.30 * tdir;
  fillpoly([tip, base + 0.20 * rad, base - 0.20 * rad], color -> col);
);

drawRotIcon(c, R, col) := (
  drawRotArrow(c, R,  25°, 155°, col);
  drawRotArrow(c, R, 205°, 335°, col);
);

// Snap the long-edge angle so an edge becomes parallel OR orthogonal
// (same thing mod 90°) to a, b, or the grid axes — within 5°.
snapAngle(ang) := (
  regional(targets, best, bestd, k, cand, dd);
  targets = [arctan2(A - O), arctan2(B - O), 0];
  best = ang;  bestd = 9999;
  forall(targets, tb,
    k    = round((ang - tb) / 90°);
    cand = tb + k * 90°;
    dd   = |ang - cand|;
    if(dd < bestd, bestd = dd;  best = cand);
  );
  if(bestd < 5°, best, ang);
);

drawGeodreieck() := (
  regional(V1, V2, V3, k, j, x, tlen, isInt, hp, rr, edgC, midC, hintC);
  V1 = geoPt(-gHalf, 0);  V2 = geoPt(gHalf, 0);  V3 = geoPt(0, gPeak);
  edgC  = [0.30, 0.26, 0.20];
  midC  = [0.42, 0.36, 0.28];
  hintC = [0.58, 0.52, 0.44];
  fillpoly([V1, V2, V3], color -> orange, alpha -> 0.12);
  draw(V1, V2, color -> edgC, size -> 2.2);
  draw(V1, V3, color -> edgC, size -> 2.2);
  draw(V2, V3, color -> edgC, size -> 2.2);
  // perpendicular centre line (thicker — for orthogonal alignment / lot)
  draw(geoPt(0, 0), geoPt(0, gPeak), color -> midC, size -> 1.8);
  // hint at the protractor semicircle (centre = scale 0): the arc plus
  // degree ticks every 10°, a little longer every 30°.
  rr = 4.6;
  connect(apply(0..36, j, geoPt(rr * cos(j * 5°), rr * sin(j * 5°))),
          color -> hintC, size -> 1.1, border -> false);
  forall(0..18, j,
    tlen = if(mod(j, 3) == 0, 0.34, 0.16);
    draw(geoPt(rr * cos(j * 10°), rr * sin(j * 10°)),
         geoPt((rr - tlen) * cos(j * 10°), (rr - tlen) * sin(j * 10°)),
         color -> hintC, size -> 1);
  );
  // scale on the long edge: 0.1 marks; 0 centred; the ends (±gHalf) stay bare
  forall(0..(20 * gHalf), k,
    x = (k - 10 * gHalf) / 10;
    if(abs(x) < gHalf,
      isInt = (mod(k, 10) == 0);
      tlen  = if(isInt, 0.34, if(mod(k, 5) == 0, 0.26, 0.14));
      draw(geoPt(x, 0), geoPt(x, tlen), color -> edgC, size -> if(isInt, 1.4, 0.9));
      if(isInt,
        drawtext(geoPt(x, 0.5), "" + abs(round(x)),
                 align -> "center", size -> fontScale * 14, color -> edgC);
      );
    );
  );
  // rotate knob: inside near the apex (stays in frame). Orange circular
  // double-arrow signals "rotate"; distinct from the petrol vectors.
  hp = geoPt(0, gPeak - 1.2);
  drawRotIcon(hp, 0.5, orange);
  draw(hp, color -> orange, size -> 6);
);

drawDrawnLines() := (
  forall(drawnLines, seg, draw(seg_1, seg_2, color -> wineRed, size -> 5));
  if(drawing, draw(curA, curB, color -> wineRed, size -> 5));
);

// Continuous update while the mouse is held (display mode).
geoUpdateDrag() := (
  regional(m);
  if(mouseDownFlag,
    m = mouse();
    if(gMode == "move",   gP   = m - gOff);
    if(gMode == "rotate", gAng = snapAngle(arctan2(m - gP) - 90°));
    if(gMode == "draw",   curB = projOntoLine(m, drawEP, drawED));
  );
);

// Edit-mode sidebar: three stacked buttons (bottom→top):
//   "Zufällige Position", "Stumpfe Winkel: an/aus", "Geodreieck zurück".
drawSidebar() := (
  regional(w, h, btnH, btnPad, btnGap, bL, bR, y0, y1, y2, y3, y4, y5);
  w = sbWidthPx();  h = sbHeightPx();
  btnH = 36;  btnPad = 8;  btnGap = 8;
  bL = sb(btnPad,     btnPad).x;
  bR = sb(w - btnPad, btnPad).x;
  y0 = sb(btnPad, btnPad).y;
  y1 = sb(btnPad, btnPad + btnH).y;
  y2 = sb(btnPad, btnPad + btnH + btnGap).y;
  y3 = sb(btnPad, 2 * btnH + btnPad + btnGap).y;
  y4 = sb(btnPad, 2 * btnH + btnPad + 2 * btnGap).y;
  y5 = sb(btnPad, 3 * btnH + btnPad + 2 * btnGap).y;

  btnRandL = bL; btnRandR = bR; btnRandB = y0; btnRandT = y1;
  fillpoly([[bL, y0], [bR, y0], [bR, y1], [bL, y1]], color -> petrol10);
  drawtext([(bL + bR) / 2, (y0 + y1) / 2], L("Zufällige Position", "Random position"),
           align -> "center", size -> fontScale * 16, color -> petrol, yoffset -> -fontScale * 16 * 0.27);

  obL = bL; obR = bR; obB = y2; obT = y3;
  fillpoly([[bL, y2], [bR, y2], [bR, y3], [bL, y3]], color -> if(allowObtuse, petrol25, petrol10));
  drawtext([(bL + bR) / 2, (y2 + y3) / 2],
           L("Stumpfe Winkel: ", "Obtuse angles: ") + if(allowObtuse, L("an", "on"), L("aus", "off")),
           align -> "center", size -> fontScale * 15, color -> petrol, yoffset -> -fontScale * 15 * 0.27);

  btnResetL = bL; btnResetR = bR; btnResetB = y4; btnResetT = y5;
  fillpoly([[bL, y4], [bR, y4], [bR, y5], [bL, y5]], color -> petrol10);
  drawtext([(bL + bR) / 2, (y4 + y5) / 2], L("Geodreieck zurück", "Reset set square"),
           align -> "center", size -> fontScale * 15, color -> petrol, yoffset -> -fontScale * 15 * 0.27);
);

// Language toggle (EN/DE): a small chip left of the cog, showing the
// language you'd switch TO. A click is an interaction → CindyJS redraws,
// so every CindyScript-drawn label updates immediately.
drawLangToggle() := (
  regional(sr, w, h, rr, ll, tt, bb);
  sr = screenresolution();
  w  = 38 / sr;  h = 26 / sr;
  rr = axCogLeft - 12 / sr;  ll = rr - w;          // sit just left of the cog
  tt = axCogCy + h / 2;      bb = axCogCy - h / 2;
  langL = ll;  langR = rr;  langB = bb;  langT = tt;
  fillpoly([[ll, bb], [rr, bb], [rr, tt], [ll, tt]], color -> [0.90, 0.90, 0.90]);
  drawtext([(ll + rr) / 2, (bb + tt) / 2], if(lang == "en", "DE", "EN"),
           align -> "center", size -> fontScale * 14, color -> colorChrome, yoffset -> -fontScale * 14 * 0.27);
);

// ----------------------------------------------------------------
// Random start position: a in Q1 with integer components in {1..4};
// b a lattice point [px, py] with angle ≥ 30° to a. With allowObtuse on
// (and after the first, acute startup) ~half the draws mirror the acute
// angle θ across 90° to 180°−θ → obtuse (b then non-lattice).
// ----------------------------------------------------------------
randomStart() := (
  regional(ax, ay, px, py, aA, t, qx, qy, theta, bDir, r);

  ax = 1 + floor(random() * 4);
  ay = 1 + floor(random() * 4);
  aA = arctan2([ax, ay]);

  px = 1; py = 2;
  repeat(40,
    qx = 1 + floor(random() * 4);
    qy = 1 + floor(random() * 4);
    if(|arctan2([qx, qy]) - aA| >= 30°, px = qx; py = qy);
  );
  if(|arctan2([px, py]) - aA| < 30°,
    if(aA >= 45°, px = 4; py = 1, px = 1; py = 4);
  );
  // ensure b is counter-clockwise from a
  if(py * ax < ay * px,
    t = ax; ax = px; px = t;
    t = ay; ay = py; py = t;
  );

  aA    = arctan2([ax, ay]);
  theta = arctan2([px, py]) - aA;
  vecA  = [ax, ay];     // a as a vector (relative to the shared origin)
  vecB  = [px, py];

  // "Stumpfe Winkel": mirror θ → 180°−θ (~half the draws, never the first)
  if(allowObtuse & obtuseReady & random() < 0.5,
    r    = sqrt(px^2 + py^2);
    bDir = aA + (180° - theta);
    vecB = [round(10 * r * cos(bDir)) / 10, round(10 * r * sin(bDir)) / 10];
  );

  needsCenter = true;   // re-centre the figure on the next frame
);

// Place the shared origin O so the figure (O and both tips) is centred
// in the drawing area; A and B follow from the stored relative vectors.
centerFigure() := (
  regional(mnx, mxx, mny, mxy, bx, by, cx, cy);
  mnx = min(0, min(vecA.x, vecB.x));  mxx = max(0, max(vecA.x, vecB.x));
  mny = min(0, min(vecA.y, vecB.y));  mxy = max(0, max(vecA.y, vecB.y));
  bx = (mnx + mxx) / 2;  by = (mny + mxy) / 2;        // figure centre rel. to O
  cx = (axLeft + axRight) / 2;
  cy = (axContentTop + axContentBottom) / 2;
  O.xy = [cx - bx, cy - by];
  A.xy = O.xy + vecA;
  B.xy = O.xy + vecB;
);

// ---- Shareable situation code (compact Base36) -----------------
// The situation = the two vectors a, b. Each component is quantised to
// 0.1 and clamped to [-9.9, 9.9] → an integer 0..198; the four values are
// packed base-200 into one number and written as a fixed 6-char Base36
// code (0–9, A–Z) — short enough to type by hand. It is shown in the
// applet; append it to the URL (…#CODE) to reproduce the exact start.
B36 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

clampU(c) := max(0, min(198, round(c * 10) + 99));   // component → 0..198

toB36(n) := (
  regional(s, d, m);
  s = "";  m = n;
  while(m > 0, d = mod(m, 36);  s = substring(B36, d, d + 1) + s;  m = floor(m / 36));
  while(length(s) < 6, s = "0" + s);
  s
);
b36val(c) := (
  regional(i, r);  r = 0;
  forall(0..35, i, if(substring(B36, i, i + 1) == c, r = i));
  r
);
fromB36(s) := (
  regional(i, n);  n = 0;
  forall(0..(length(s) - 1), i, n = n * 36 + b36val(substring(s, i, i + 1)));
  n
);

encodeSituation() := (
  regional(va, vb, N);
  va = A.xy - O.xy;  vb = B.xy - O.xy;
  N = ((clampU(va.x) * 200 + clampU(va.y)) * 200 + clampU(vb.x)) * 200 + clampU(vb.y);
  toB36(N)
);

decodeSituation(s) := (
  regional(N, u1, u2, u3, u4);
  if(length(s) >= 1,
    N  = fromB36(s);
    u4 = mod(N, 200);  N = floor(N / 200);
    u3 = mod(N, 200);  N = floor(N / 200);
    u2 = mod(N, 200);  N = floor(N / 200);
    u1 = mod(N, 200);
    vecA = [(u1 - 99) / 10, (u2 - 99) / 10];
    vecB = [(u3 - 99) / 10, (u4 - 99) / 10];
    needsCenter = true;
  );
  1
);

// ----------------------------------------------------------------
// Initial values
// ----------------------------------------------------------------
O.xy  = [0, 0];

A.color = colorPoint;  A.size = 10;  A.labelled = false;
B.color = colorPoint;  B.size = 10;  B.labelled = false;

editmode    = false;
wasPortrait = false;
lang        = "de";   // UI language "de"/"en"; set from the URL hash (#en) by JS

// Bilingual UI helper — returns the German or the English variant.
L(de, en) := if(lang == "en", en, de);

// Sidebar (vector controls) shown only in edit mode.
allowObtuse   = true;    // obtuse angles allowed in random mode…
obtuseReady   = false;   // …but the first (startup) position is acute
mouseDownFlag = false;

// Button-bounds globals (set each frame).
btnRandL=0; btnRandR=0; btnRandB=0; btnRandT=0;   // "Zufällige Position" (edit)
obL=0; obR=0; obB=0; obT=0;                        // "Stumpfe Winkel"    (edit)
btnResetL=0; btnResetR=0; btnResetB=0; btnResetT=0; // "Geodreieck zurück" (edit)
udL=0; udR=0; udB=0; udT=0;                        // "Linie zurück" (display, top-right)
langL=0; langR=0; langB=0; langT=0;                // EN/DE language toggle (left of the cog)

// Geodreieck state: long edge spans 2·gHalf units; peak height gPeak.
gHalf = 7;  gPeak = 7;
gP0   = [2, -1.5];  gAng0 = 0;       // default pose (used by "zurück")
gP    = gP0;  gAng = gAng0;
gMode = "none";  gOff = [0, 0];
drawnLines = [];
drawing = false;  curA = [0, 0];  curB = [0, 0];
drawEP  = [0, 0];  drawED = [1, 0];

randomStart();
obtuseReady = true;   // from now on "Zufällige Position" may produce obtuse angles

resetclock();
playAnimation();

</script>

     CSMOVE — runs every animation frame

<script id="csmove" type="text/x-cindyscript">

// Geodreieck drag (move / rotate / draw) is handled in csdraw via

<!-- ===========================================================
     CSDRAW — runs every frame after csmove
     =========================================================== -->
<script id="csdraw" type="text/x-cindyscript">

// Coordinate grid only while editing: in display mode draw it white
// (invisible on the white background) so students must really measure
// with the Geodreieck; in edit mode keep it grey as a placement aid.
gridColor = if(editmode, [0.80, 0.81, 0.81], [1, 1, 1]);

// Localised title + credits (drawn by the chrome below); react live to #en.
appletTitle        = L("Das Skalarprodukt „clever messen“", "The Scalar Product — Measuring Cleverly");
appletAffiliations = L("QuaMath (DZLM + IPN, gef. v. KMK) | LiAnMU | Universität Paderborn",
                       "QuaMath (DZLM + IPN, funded by KMK) | LiAnMU | Paderborn University");

// 1) Layout + anchors.
platformBeginFrame();

// Re-centre the vector figure when flagged (after a random draw / startup,
// or when the orientation changed) — anchors are now available.
if((isPortrait != wasPortrait) & (!needsCenter),
  vecA = A.xy - O.xy;  vecB = B.xy - O.xy;  needsCenter = true);
if(needsCenter, centerFigure();  needsCenter = false);

// 2) Vector arrows drawn in both modes; the A/B grab dots only show in
//    edit mode (draggable there; hidden and pinned in display mode).
A.visible = editmode;  B.visible = editmode;
A.pinned  = !editmode;  B.pinned = !editmode;

// 3) Status / hint.
if(editmode,
  setStatus(
    L(["SITUATION BEARBEITEN: Endpunkte von a und b ziehen",
       "oder „Zufällige Position“ — danach im Anzeigemodus messen."],
      ["EDIT THE SITUATION: drag the tips of a and b,",
       "or use “Random position” — then measure in display mode."]),
    "alert");
,
  clearStatus();
);

// 4) Sidebar (vector controls — edit mode only).
if(sidebarVisible, drawSidebar());
wasPortrait = isPortrait;

// 5) Display mode: update + draw Geodreieck (below) and the drawn lines
//    (on top), plus a single "Linie zurück" (undo) button top-right.
if(!editmode,
  geoUpdateDrag();
  drawGeodreieck();
  drawDrawnLines();
  udR = axContentRight;  udL = udR - 132 / screenresolution();
  udT = axContentTop;    udB = udT - 34 / screenresolution();
  fillpoly([[udL, udB], [udR, udB], [udR, udT], [udL, udT]], color -> petrol10);
  drawtext([(udL + udR) / 2, (udB + udT) / 2], L("Linie zurück", "Undo line"),
           align -> "center", size -> fontScale * 15, color -> petrol, yoffset -> -fontScale * 15 * 0.27);
);

// 6) The two vectors on top of the (translucent) Geodreieck.
drawVecs();

// 7) Chrome on top.
drawTitle();
drawCog();
drawLangToggle();
drawUnit();
drawStatusOrCredits();

// 8) Shareable situation code next to the title, sharing its baseline
//    (bottom-aligned, a bit smaller). The leading "#" makes it copy-paste
//    ready onto the URL (…#code) to reproduce this exact start.
sitFs   = fontScale * if(isPortrait, fontTitleP, fontTitle);
sitM    = pixelsize(appletTitle, size -> sitFs);
sitBase = axTitleCy + (sitM_3 - sitM_2) / (2 * screenresolution());
drawLabel(axTitleLeft + (sitM_1 + 22) / screenresolution(),
          sitBase, "#" + encodeSituation(),
          fontScale * 15, colorChrome, "left", "base", false, 5);

</script>


<!-- ===========================================================
     CSMOUSEDOWN — cog button toggles edit mode
     =========================================================== -->
<script id="csmousedown" type="text/x-cindyscript">
mouseDownFlag = true;
hitUndo = false;
if(mouse().x > axCogLeft & mouse().x < axCogRight &
   mouse().y > axCogBot  & mouse().y < axCogTop,
  editmode = !editmode;
);
// Language toggle (left of the cog) — flip between German and English.
if(mouse().x > langL & mouse().x < langR &
   mouse().y > langB & mouse().y < langT,
  lang = if(lang == "en", "de", "en");
);
// Edit-mode buttons
if(editmode & mouse().x > btnRandL & mouse().x < btnRandR &
   mouse().y > btnRandB & mouse().y < btnRandT, randomStart());
if(editmode & mouse().x > obL & mouse().x < obR &
   mouse().y > obB & mouse().y < obT, allowObtuse = !allowObtuse);
if(editmode & mouse().x > btnResetL & mouse().x < btnResetR &
   mouse().y > btnResetB & mouse().y < btnResetT, gP = gP0; gAng = gAng0);
// Display-mode: undo last drawn line (top-right button)
if(!editmode & mouse().x > udL & mouse().x < udR &
   mouse().y > udB & mouse().y < udT,
  if(length(drawnLines) > 0, drawnLines = drawnLines_(1..(length(drawnLines) - 1)));
  hitUndo = true;
);

// Display-mode: grab the Geodreieck (rotate knob / draw on edge / move body)
if(!editmode & !hitUndo,
  regional(m, hp, V1, V2, V3, d0, d1, d2, dmin);
  m = mouse();
  V1 = geoPt(-gHalf, 0);  V2 = geoPt(gHalf, 0);  V3 = geoPt(0, gPeak);
  hp = geoPt(0, gPeak - 1.2);
  if(|m - hp| < 0.7,
    gMode = "rotate";
  ,
    d0 = distToSeg(m, V1, V2);
    d1 = distToSeg(m, V1, V3);
    d2 = distToSeg(m, V2, V3);
    dmin = min(d0, min(d1, d2));
    if(dmin < 0.45,
      gMode = "draw";
      if(d0 <= d1 & d0 <= d2, drawEP = V1; drawED = (V2 - V1) / |V2 - V1|);
      if(d1 <  d0 & d1 <= d2, drawEP = V1; drawED = (V3 - V1) / |V3 - V1|);
      if(d2 <  d0 & d2 <  d1, drawEP = V2; drawED = (V3 - V2) / |V3 - V2|);
      curA = projOntoLine(m, drawEP, drawED);  curB = curA;  drawing = true;
    ,
      if(pointInTri(m, V1, V2, V3), gMode = "move";  gOff = m - gP, gMode = "none");
    );
  );
);
</script>


<!-- ===========================================================
     CSMOUSEUP — clear the mouse-button state
     =========================================================== -->
<script id="csmouseup" type="text/x-cindyscript">
mouseDownFlag = false;
if(drawing,
  if(|curB - curA| > 0.3, drawnLines = drawnLines ++ [[curA, curB]]);
  drawing = false;
);
gMode = "none";
</script>


<!-- ===========================================================
     CindyJS initialization — geometry objects and viewport
     =========================================================== -->
<script type="text/javascript">
var cdy = CindyJS({
    scripts: "cs*",
    defaultAppearance: {
        dimDependent: 0.7,
        fontFamily:   "sans-serif",
        lineSize:     1,
        pointSize:    5.0,
        textsize:     12.0
    },
    angleUnit: "°",
    geometry: [
        // Origin (pinned, invisible)
        {name: "O", type: "Free", pos: [0.0, 0.0, 1.0],
            color: [1.0, 0.0, 0.0], visible: false, pinned: true, labeled: true},
        // Tip of vector a (draggable in edit mode)
        {name: "A", type: "Free", pos: [4.0, 2.0, 1.0],
            dimDependent: 1, color: [0.643, 0.255, 0.408], size: 10.0},
        // Tip of vector b (draggable in edit mode)
        {name: "B", type: "Free", pos: [-1.0, 3.0, 1.0],
            dimDependent: 1, color: [0.643, 0.255, 0.408], size: 10.0}
    ],
    ports: [{
        id: "CSCanvas",
        transform: [{visibleRect: [-6.5, 7.5, 10.5, -2.5]}],
        grid: 0,
        snap: true,
        background: "rgb(255,255,255)"
    }],
    csconsole: false,
    use: ["katex"],
    cinderella: {build: 2124, version: [3, 0, 2124]}
});

// ===========================================================
// URL hash → language + situation code, e.g.  #en  ·  #IGNZCP  ·  #en-IGNZCP
// Segments are split on any non-alphanumeric char (order doesn't matter):
// "de"/"en" set the language, a longer token is the Base36 situation code.
// Everything is whitelisted to [0-9A-Za-z], so the hash can't inject script.
// ===========================================================
function appReadHash() {
    var segs = (location.hash || "").replace(/^#/, "").split(/[^0-9A-Za-z]+/);
    var lang = "de", code = null, i, s;
    for (i = 0; i < segs.length; i++) {
        s = segs[i];
        if (!s) continue;
        if (/^(de|en)$/i.test(s)) lang = s.toLowerCase();   // language tag
        else                      code = s.toUpperCase();   // Base36 situation code
    }
    return { lang: lang, code: code };
}

(function () {
    var doneCode = false, tries = 0;
    function apply() {
        var h = appReadHash(), ready = false;
        try { cdy.evalcs('lang="' + (h.lang === "en" ? "en" : "de") + '"'); ready = true; }
        catch (e) { /* interpreter not ready yet */ }
        if (ready && h.code && !doneCode) {
            try {
                var r = cdy.evalcs('decodeSituation("' + h.code + '")');
                if (r && r.value && r.value.real === 1) doneCode = true;
            } catch (e) { }
        }
        var done = ready && (doneCode || !h.code);
        if (!done && tries++ < 120) setTimeout(apply, 100);
    }
    setTimeout(apply, 150);
    // React live when the hash is edited (language and/or code). A code change
    // moves the geometry and redraws immediately; a pure language change takes
    // effect on the next redraw (e.g. the next interaction). The language is
    // normally chosen at load time via the embed URL, so this is fine.
    window.addEventListener("hashchange", function () { doneCode = false; tries = 0; apply(); });
})();

// ===========================================================
// Responsive viewport: keep the grid-cell size identical in
// portrait and landscape.
//
// CindyJS' visibleRect fits the rectangle with a uniform
// min-scale, so a fixed landscape-shaped rect (17×10) gets a
// much smaller scale on a tall portrait canvas — the squares
// shrink. To avoid that we rebuild the visibleRect for the
// current canvas so the scale (px per unit) always equals the
// scale this device would use in landscape. Landscape and
// desktop are unaffected; portrait simply zooms in to match.
//
// CindyJS re-reads ports[].transform on every (real) resize and
// defers the recompute via requestAnimationFrame, while these
// listeners run synchronously first — so the updated rect is
// what CindyJS applies.
// ===========================================================
(function () {
  // Design rectangle, mirrors visibleRect [-6.5, 7.5, 10.5, -2.5].
  var DW = 17, DH = 10, CX = 2, CY = 2.5;
  function applyResponsiveViewport() {
    var el = document.getElementById("CSCanvas");
    var W = (el && el.clientWidth)  || window.innerWidth;
    var H = (el && el.clientHeight) || window.innerHeight;
    if (!(W > 0 && H > 0)) return;
    // Scale this device uses in landscape (long side ↔ width).
    var sr = Math.min(Math.max(W, H) / DW, Math.min(W, H) / DH);
    var halfW = W / sr / 2, halfH = H / sr / 2;
    // Rect aspect matches the canvas, so min-fit reproduces sr exactly.
    cdy.config.ports[0].transform[0].visibleRect =
      [CX - halfW, CY + halfH, CX + halfW, CY - halfH];
  }
  applyResponsiveViewport();   // before CindyJS' deferred startup reads config
  window.addEventListener("resize", applyResponsiveViewport);
  window.addEventListener("orientationchange", applyResponsiveViewport);
})();

// ===========================================================
// Ergebnis-Eingabe ("clever messen"): kleines HTML-Panel unten
// rechts (Overlay über dem Canvas). Die Schülerin tippt ihr
// gemessenes a·b ein; sobald das Feld nicht leer ist, werden zwei
// unabhängige Urteile gezeigt:
//   • Vorzeichen  ✓ / ✗   (Richtung der Projektion: spitz +, stumpf −)
//   • Fehler      passt exakt / ungefähr / zu große Abweichung
// Toleranzen unten als Prozent-Parameter (+ absoluter Sockel für
// a·b ≈ 0). Reine JS/HTML-Schicht: CindyScript bleibt unverändert;
// der wahre Wert und der Modus werden per evalcs gelesen.
// ===========================================================
(function () {
  // ---- Justierbare Toleranzen ----
  var TOL_EXACT_ABS = 1e-6;  // praktisch 0 (nur Float-Rauschen) → "passt genau" nur bei WIRKLICH exaktem Wert
  var TOL_OK_PCT    = 10;    // |Δ| ≤ 10 % von |a·b|  → passt ungefähr
  var TOL_FLOOR     = 0.3;   // absoluter Sockel (greift bei a·b ≈ 0)
  var DEBOUNCE_MS   = 300;   // Verzögerung gegen Flackern beim Tippen

  // Panel labels per language (driven by the #en hash, like the rest of the UI).
  var PANEL_STR = {
    de: { sign: "Vorzeichen", exact: "passt genau", ok: "passt ungefähr", bad: "passt nicht" },
    en: { sign: "Sign",       exact: "exact",       ok: "about right",    bad: "too far"     }
  };

  function start() {
    var panel = document.createElement("div");
    panel.id = "resultPanel";
    panel.innerHTML =
      '<div class="rp-row"><span class="rp-lbl">a&nbsp;·&nbsp;b&nbsp;≈</span>' +
      '<input id="rp-in" type="text" inputmode="decimal" autocomplete="off" ' +
      'spellcheck="false" placeholder="?"></div>' +
      '<div class="rp-status"><span id="rp-sign"></span><span id="rp-err"></span></div>';
    document.body.appendChild(panel);

    var input  = document.getElementById("rp-in");
    var elSign = document.getElementById("rp-sign");
    var elErr  = document.getElementById("rp-err");

    function evalReal(expr) {
      try {
        var r = cdy.evalcs(expr);
        if (r && r.value && typeof r.value.real === "number") return r.value.real;
      } catch (e) { /* interpreter not ready */ }
      return null;
    }
    // True scalar product a·b = (A−O)·(B−O), read live from the geometry.
    function trueValue() {
      return evalReal("(A.xy.x-O.xy.x)*(B.xy.x-O.xy.x)+(A.xy.y-O.xy.y)*(B.xy.y-O.xy.y)");
    }
    function isEdit() { return evalReal("if(editmode,1,0)") === 1; }
    // Current UI language — read from CindyScript so it follows BOTH the URL
    // hash (set at load) and the in-applet EN/DE toggle.
    function curLang() {
      try { if (cdy.evalcs("lang").value === "en") return "en"; } catch (e) { }
      return "de";
    }

    function chip(el, text, cls) { el.textContent = text; el.className = cls; }

    function render() {
      var raw = input.value.trim();
      if (raw === "") { chip(elSign, "", ""); chip(elErr, "", ""); return; }
      var S = parseFloat(raw.replace(/,/g, "."));              // Komma ODER Punkt erlaubt
      var T = trueValue();
      if (T === null) return;                                  // interpreter not ready
      if (!isFinite(S)) { chip(elSign, "", ""); chip(elErr, "", ""); return; }
      var absT = Math.abs(T);
      var STR  = PANEL_STR[curLang()] || PANEL_STR.de;

      // Vorzeichen-Urteil zuerst (neutral bei a·b ≈ 0 oder noch unklarer Eingabe).
      var signBad = false;
      if      (absT <= TOL_FLOOR || Math.abs(S) < 1e-9) chip(elSign, STR.sign + " —", "rp-neutral");
      else if ((S >= 0) === (T >= 0))                   chip(elSign, STR.sign + " ✓", "rp-good");
      else { chip(elSign, STR.sign + " ✗", "rp-bad"); signBad = true; }

      // Bei falschem Vorzeichen das "passt …" ganz ausblenden.
      if (signBad) { chip(elErr, "", ""); return; }

      // Sonst das Genauigkeits-Urteil — auf den Beträgen ausgewertet.
      var m         = Math.abs(Math.abs(S) - absT);
      var exactBand = TOL_EXACT_ABS;
      var okBand    = Math.max(TOL_FLOOR, absT * TOL_OK_PCT / 100);
      if      (m <= exactBand) chip(elErr, STR.exact, "rp-good");
      else if (m <= okBand)    chip(elErr, STR.ok,    "rp-good");   // Regelfall beim Messen → grün
      else                     chip(elErr, STR.bad,   "rp-bad");
    }

    // Sanitise to digits / comma / point / a single leading minus, then
    // auto-evaluate (debounced so the chip doesn't flicker while typing).
    var debounce = null;
    input.addEventListener("input", function () {
      var v   = input.value.replace(/[^0-9.,\-]/g, "");
      var neg = v.charAt(0) === "-";
      v = v.replace(/-/g, ""); if (neg) v = "-" + v;
      if (input.value !== v) input.value = v;
      clearTimeout(debounce);
      debounce = setTimeout(render, DEBOUNCE_MS);
    });

    // Show the panel only in display mode; re-evaluate when the situation
    // (a·b) changes — new random pose, dragged vectors, or a #permalink.
    var lastT = null, lastVisible = null, lastLang = null;
    setInterval(function () {
      var ready   = trueValue() !== null;
      var visible = ready && !isEdit();
      if (visible !== lastVisible) {
        panel.style.display = visible ? "block" : "none";
        lastVisible = visible;
      }
      if (visible) {
        var T = trueValue(), lg = curLang();
        if ((T !== lastT || lg !== lastLang) && input.value.trim() !== "") render();
        lastT = T;  lastLang = lg;
      }
    }, 200);

    // Re-render the verdict labels when the language is switched live (#en/#de).
    window.addEventListener("hashchange", function () { if (input.value.trim() !== "") render(); });
  }

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
</head>
<body>
    <div id="CSCanvas"></div>
</body>
</html>
